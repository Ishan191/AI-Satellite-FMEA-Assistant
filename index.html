<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛰️ AI Satellite FMEA Assistant</title>
  
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  
  <style>
    * {

      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: white;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      text-align: center;
      padding: 20px;
      background: #1e2937;
      border-bottom: 1px solid #334155;
    }
    #chat {
      height: calc(100vh - 80px);
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛰️ AI Satellite FMEA Assistant</h1>
    <p>ECSS-Q-ST-30-02C • Powered by n8n</p>
  </div>

  <div id="chat"></div>

  <script src="https://cdn.jsdelivr.net/npm/@n8n/chat@latest/dist/chat.umd.js"></script>
  <script>
    window.Chat.create({
      webhookUrl: "https://ian191.app.n8n.cloud/webhook/188eeb24-a13e-422f-a0c4-ab297cd8ab04",
      container: "#chat",
      theme: "dark",
      title: "Satellite FMEA Assistant",
      subtitle: "Describe any satellite anomaly for FMEA analysis",
      initialMessage: "Hello! I'm ready to analyze satellite failures.\n\nExample: 'Sudden voltage drop in battery during eclipse'",
